services:
  - type: web
    name: amir-travel-europe
    env: python
    rootDir: amir_travel
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # For production, prefer a managed PostgreSQL and update DATABASE_URL accordingly
      - key: DATABASE_URL
        value: sqlite:///database.db
